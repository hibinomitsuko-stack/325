<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px}
.wrap{padding:48px 110px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:20px}
.card{padding:26px 36px}
.lb{font-size:23px;font-weight:900;margin-bottom:14px}
.r .lb{color:var(--neon)}
.l .lb{color:#8690b8}
.nums{display:flex;align-items:center;gap:26px;flex-wrap:nowrap}
.n{text-align:center}
.n .v{font-size:50px;font-weight:900;line-height:1.1}
.n .t{font-size:19px;font-weight:800;color:var(--ink2);margin-top:4px}
.ar{font-size:30px;font-weight:900}
.r .ar{color:var(--mag)}
.l .ar{color:rgba(185,196,255,.4)}
.r .v{color:var(--neon);text-shadow:0 0 16px rgba(217,255,61,.6)}
.l .v{color:#8690b8}
.res{margin-left:auto;font-size:26px;font-weight:900;line-height:1.4;text-align:right}
.r .res{color:#fff}
.l .res{color:#8690b8}
.note{margin-top:8px;text-align:center;font-size:25px;font-weight:900;color:#fff;
  position:relative;z-index:2;line-height:1.5}
.note b{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>外から来ている記事の、<span class="o ul">見分け方</span></h1></div>
<div class="wrap">
  <div class="card neon m r">
    <div class="lb">読まれた1本</div>
    <div class="nums">
      <div class="n"><div class="v">836</div><div class="t">インプレッション</div></div>
      <div class="ar">▶</div>
      <div class="n"><div class="v">941</div><div class="t">ページビュー</div></div>
      <div class="res">PVのほうが多い<br>＝ 外から来ている</div>
    </div>
  </div>
  <div class="card neon dim l">
    <div class="lb">残りの12本</div>
    <div class="nums">
      <div class="n"><div class="v">3,017</div><div class="t">インプレッション</div></div>
      <div class="ar">▶</div>
      <div class="n"><div class="v">242</div><div class="t">ページビュー</div></div>
      <div class="res">8.0%<br>＝ note の中で止まっている</div>
    </div>
  </div>
  <div class="note">見るのは <b>インプレッションとPVを並べる</b> だけ</div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>PVが近い・超えている記事 ＝ <span class="hl">あなたの入口</span></span></div>
</body></html>
