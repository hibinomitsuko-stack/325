<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:900px}
.sheet{margin:46px 110px 0;padding:30px 42px 34px;position:relative;z-index:2}
table{width:100%;border-collapse:collapse}
th{font-size:23px;font-weight:900;color:var(--neon);padding:0 10px 16px;text-align:left;
  text-shadow:0 0 12px rgba(217,255,61,.55)}
th.c{text-align:center}
td{font-size:25px;font-weight:800;color:#fff;padding:18px 10px;border-top:1.5px dashed rgba(185,196,255,.3)}
.ln{height:38px;border-bottom:3px dotted rgba(185,196,255,.55)}
.no{color:var(--ink2);font-size:23px}
.hint{margin-top:20px;font-size:22px;font-weight:800;color:var(--ink2);line-height:1.6}
.hint b{color:var(--neon)}
</style></head><body>
<div class="head"><h1>記事の<span class="o ul">仕分けシート</span></h1></div>
<div class="sheet neon">
  <table>
    <tr><th>記事</th><th class="c">インプレッション</th><th class="c">PV</th><th class="c">印</th></tr>
    <tr><td class="no">1本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
    <tr><td class="no">2本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
    <tr><td class="no">3本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
    <tr><td class="no">4本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
  </table>
  <div class="hint"><b>PVがインプレッションに近い、または超えている記事</b>に印をつける<br>
  → その記事を公開したとき、どこからリンクを置いたか。それが今ある唯一の入口です</div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>今日は <span class="hl">仕分けまで</span> で終わりです</span></div>
</body></html>
