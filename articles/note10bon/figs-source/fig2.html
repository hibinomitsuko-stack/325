<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px}
.row{display:flex;justify-content:center;gap:44px;padding:50px 90px 0;position:relative;z-index:2}
.col{width:640px;overflow:hidden}
.cap{text-align:center;font-size:28px;font-weight:900;padding:16px 0;color:#fff}
.l .cap{background:linear-gradient(100deg,rgba(90,100,150,.85),rgba(70,80,130,.85))}
.r .cap{background:linear-gradient(100deg,var(--mag),var(--vio))}
.box{padding:22px 30px 26px}
li{list-style:none;font-size:24px;font-weight:800;line-height:1.5;padding:15px 0 15px 44px;position:relative;color:#fff}
li+li{border-top:1.5px dashed rgba(185,196,255,.28)}
li::before{content:"";position:absolute;left:8px;top:21px;width:18px;height:18px;border-radius:50%}
.l li::before{background:#6b7aa8}
.r li::before{background:var(--mag);box-shadow:0 0 10px rgba(240,38,200,.9)}
.key{margin-top:18px;border-top:2px dashed rgba(185,196,255,.35);padding-top:18px;
  font-size:27px;font-weight:900;line-height:1.5;text-align:center}
.l .key{color:#8690b8}
.r .key{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>違いは、記事の<span class="o ul">中身ではなかった</span></h1></div>
<div class="row">
  <div class="col neon dim l">
    <div class="cap">読まれなかった12本</div>
    <div class="box"><ul>
      <li>同じ型で書いた</li><li>3,000字を超えている</li><li>図解を4枚入れた</li><li>公開して、終わり</li>
    </ul>
    <div class="key">入口が、なかった</div></div>
  </div>
  <div class="col neon m r">
    <div class="cap">読まれた1本</div>
    <div class="box"><ul>
      <li>同じ型で書いた</li><li>3,000字を超えている</li><li>図解を4枚入れた</li><li>SNSの投稿からリンクを置いた</li>
    </ul>
    <div class="key">外から人を連れてきた</div></div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>記事を増やしても、<span class="hl">入口は増えない</span></span></div>
</body></html>
