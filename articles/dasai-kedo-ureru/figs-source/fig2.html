<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px}
.wrap{padding:44px 80px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:24px}
.row{padding:26px 34px}
.lb{font-size:24px;font-weight:900;margin-bottom:16px}
.m .lb{color:var(--neon)}.dim .lb{color:#8690b8}
.flow{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.st{text-align:center;font-size:24px;font-weight:900;padding:15px 10px;border-radius:12px;line-height:1.3;flex:1}
.dim .st{background:rgba(120,132,180,.18);color:#9aa4ca}
.m .st{background:rgba(240,38,200,.14);color:#fff}
.m .st.end{background:rgba(217,255,61,.13);color:var(--neon)}
.m .st.goal{background:rgba(35,201,255,.16);color:var(--cyan)}
.grp{flex:2.6;display:flex;gap:10px;padding:12px;border-radius:14px;
  border:2px solid rgba(240,38,200,.55);box-shadow:0 0 16px rgba(240,38,200,.3)}
.grp .st{font-size:23px;padding:11px 6px}
.ar{font-size:22px;font-weight:900;flex:none}
.m .ar{color:var(--mag)}.dim .ar{color:#5f6a94}
.tag{text-align:center;font-size:21px;font-weight:900;color:var(--mag);margin-top:10px}
.res{margin-top:14px;padding-top:14px;border-top:1.5px dashed rgba(185,196,255,.3);
  font-size:25px;font-weight:900;text-align:center}
.dim .res{color:#8690b8}.m .res{color:#fff}
</style></head><body>
<div class="head"><h1>変えたのは、<span class="o ul">順番</span>だけ</h1></div>
<div class="wrap">
  <div class="neon dim row">
    <div class="lb">以前（「綺麗だけど、売れない」）</div>
    <div class="flow">
      <div class="st">整える</div><div class="ar">▶</div>
      <div class="st">目立たせる</div><div class="ar">▶</div>
      <div class="st">分かりやすくする</div>
    </div>
    <div class="res">何を伝えるか決まらないまま、綺麗にし始めていた</div>
  </div>
  <div class="neon m row">
    <div class="lb">今（「ダサいけど、売れる」）</div>
    <div class="flow">
      <div class="st goal">目的を<br>決める</div><div class="ar">▶</div>
      <div class="grp">
        <div class="st">止まる</div><div class="st">分かる</div>
        <div class="st">信じる</div><div class="st">動ける</div>
      </div>
      <div class="ar">▶</div>
      <div class="st end">最後に<br>整える</div>
    </div>
    <div class="tag">↑ 見た人の迷いを、この順に減らす</div>
    <div class="res">美しさを捨てたのではなく、使う順番を変えた</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>センスではなく、<span class="hl">どこから考えるか</span></span></div>
</body></html>
