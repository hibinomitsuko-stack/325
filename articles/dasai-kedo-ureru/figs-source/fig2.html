<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px}
.wrap{padding:44px 86px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:24px}
.row{padding:26px 36px}
.lb{font-size:24px;font-weight:900;margin-bottom:16px}
.m .lb{color:var(--neon)}.dim .lb{color:#8690b8}
.flow{display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.st{flex:1;text-align:center;font-size:25px;font-weight:900;padding:16px 8px;border-radius:12px;line-height:1.3}
.m .st{background:rgba(240,38,200,.16);color:#fff}
.dim .st{background:rgba(120,132,180,.18);color:#9aa4ca}
.m .st.last{background:rgba(217,255,61,.14);color:var(--neon)}
.ar{font-size:24px;font-weight:900;flex:none}
.m .ar{color:var(--mag)}.dim .ar{color:#5f6a94}
.res{margin-top:16px;padding-top:14px;border-top:1.5px dashed rgba(185,196,255,.3);
  font-size:26px;font-weight:900;text-align:center}
.dim .res{color:#8690b8}.m .res{color:#fff}
</style></head><body>
<div class="head"><h1>変えたのは、考える<span class="o ul">順番</span>だけ</h1></div>
<div class="wrap">
  <div class="neon dim row">
    <div class="lb">以前（「綺麗だけど、売れない」）</div>
    <div class="flow">
      <div class="st">綺麗にする</div><div class="ar">▶</div>
      <div class="st">目立たせる</div><div class="ar">▶</div>
      <div class="st">分かりやすくする</div>
    </div>
    <div class="res">きれいだけど、見られない</div>
  </div>
  <div class="neon m row">
    <div class="lb">今（「ダサいけど、売れる」）</div>
    <div class="flow">
      <div class="st">目立たせる</div><div class="ar">▶</div>
      <div class="st">分かりやすく</div><div class="ar">▶</div>
      <div class="st">覚えてもらう</div><div class="ar">▶</div>
      <div class="st last">最後に整える</div>
    </div>
    <div class="res">やっていることは同じ。順番だけが違う</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>センスではなく、<span class="hl">どこから考えるか</span></span></div>
</body></html>
