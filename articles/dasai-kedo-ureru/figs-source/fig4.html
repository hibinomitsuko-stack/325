<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:1120px}
.wrap{padding:40px 92px 0;position:relative;z-index:2}
.sheet{padding:26px 40px 28px}
.row{display:flex;align-items:center;gap:18px;padding:13px 0;border-bottom:1.5px dashed rgba(185,196,255,.2)}
.min{flex:none;width:66px;font-size:22px;font-weight:900;color:var(--cyan)}
.k{flex:none;width:360px;font-size:24px;font-weight:900;line-height:1.3}
.ln{flex:1;border-bottom:2.5px dotted rgba(185,196,255,.5);height:28px}
.sep{margin:16px 0 8px;padding-top:14px;border-top:1.5px dashed rgba(185,196,255,.3);
  font-size:23px;font-weight:900;color:var(--neon)}
.fx{display:flex;align-items:center;gap:16px;font-size:23px;font-weight:800;color:#e8ecff;padding:7px 0}
.box{width:22px;height:22px;border:2.5px solid var(--cyan);border-radius:6px;flex:none}
.fx b{color:var(--neon);font-weight:900}
</style></head><body>
<div class="head"><h1>15分でできる、<span class="o ul">販促デザイン診断</span></h1></div>
<div class="wrap">
  <div class="sheet neon m">
    <div class="row"><div class="min">3分</div><div class="k">〔誰〕に〔何〕を伝えて〔どう動いて〕ほしいか</div><div class="ln"></div></div>
    <div class="row"><div class="min">3分</div><div class="k">3秒見て ─ 何の商品だったか</div><div class="ln"></div></div>
    <div class="row"><div class="min"></div><div class="k">　　　　　　誰向けだったか</div><div class="ln"></div></div>
    <div class="row"><div class="min"></div><div class="k">　　　　　　次に何をするか</div><div class="ln"></div></div>
    <div class="row"><div class="min">4分</div><div class="k">いちばん大きい不安は</div><div class="ln"></div></div>
    <div class="row"><div class="min"></div><div class="k">　それを消す材料は</div><div class="ln"></div></div>
    <div class="row"><div class="min">3分</div><div class="k">押したあとが想像できるか</div><div class="ln"></div></div>
    <div class="sep">2分｜直す1か所だけ決める</div>
    <div class="fx"><span class="box"></span>止まらない　→　<b>最初の言葉か、写真</b></div>
    <div class="fx"><span class="box"></span>分からない　→　<b>いちばん大きい1行</b></div>
    <div class="fx"><span class="box"></span>信じられない　→　<b>不安を消す材料</b></div>
    <div class="fx"><span class="box"></span>動けない　→　<b>ボタンの言葉か、その近くの一言</b></div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>いちばん<span class="hl">手前で止まっている1か所</span>だけ直す</span></div>
</body></html>
