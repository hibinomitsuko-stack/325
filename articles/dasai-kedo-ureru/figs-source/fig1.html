<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:800px}
.wrap{display:flex;gap:38px;padding:44px 90px 0;position:relative;z-index:2}
.col{flex:1;border-radius:22px;overflow:hidden}
.cap{font-size:27px;font-weight:900;text-align:center;padding:16px 0}
.dim .cap{background:rgba(120,132,180,.3);color:#cfd6f5}
.m .cap{background:linear-gradient(100deg,var(--mag),var(--vio));color:#fff}
.body{padding:22px 30px 26px}
.it{display:flex;align-items:center;gap:15px;font-size:25px;font-weight:800;padding:14px 0;
  border-bottom:1.5px dashed rgba(185,196,255,.22)}
.it:last-of-type{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.dim .dot{background:#7f89b4}.m .dot{background:var(--mag);box-shadow:0 0 12px rgba(240,38,200,.9)}
.dim .it{color:#aab3d8}
.res{margin-top:12px;padding-top:15px;border-top:1.5px dashed rgba(185,196,255,.3);
  text-align:center;font-size:25px;font-weight:900;line-height:1.4}
.dim .res{color:#8690b8}
.m .res{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.55)}
</style></head><body>
<div class="head"><h1>時間をかけた場所と、<span class="o ul">迷っていた場所</span></h1></div>
<div class="wrap">
  <div class="col neon dim">
    <div class="cap">私が何日もかけていた</div>
    <div class="body">
      <div class="it"><span class="dot"></span>余白のバランス</div>
      <div class="it"><span class="dot"></span>フォントを7種類ためす</div>
      <div class="it"><span class="dot"></span>色の階調の微調整</div>
      <div class="it"><span class="dot"></span>写真の明るさ</div>
      <div class="res">全部、見た目を整える作業</div>
    </div>
  </div>
  <div class="col neon m">
    <div class="cap">初めて見た人が迷っていた</div>
    <div class="body">
      <div class="it"><span class="dot"></span>自分に関係があるか（気づく）</div>
      <div class="it"><span class="dot"></span>何の商品か（分かる）</div>
      <div class="it"><span class="dot"></span>本当かどうか（信じる）</div>
      <div class="it"><span class="dot"></span>次に何をするか（動く）</div>
      <div class="res">ここは、フォントでは埋まらない</div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>「綺麗だけど売れない」＝<span class="hl">作り手だけが分かっている</span></span></div>
</body></html>
