<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px}
.wrap{padding:42px 92px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:20px}
.step{padding:22px 34px;display:flex;align-items:center;gap:24px}
.no{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:#05040f;background:var(--neon);box-shadow:0 0 16px rgba(217,255,61,.65)}
.step .t{font-size:29px;font-weight:900;line-height:1.35}
.step .s{font-size:22px;font-weight:800;color:var(--ink2);margin-top:6px}
.axes{display:flex;gap:16px;padding:22px 34px}
.ax{flex:1;text-align:center;padding:18px 8px;border-radius:12px;
  background:rgba(240,38,200,.14);font-size:26px;font-weight:900;color:#fff}
.ng{padding:20px 34px;display:flex;align-items:center;gap:22px}
.x{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(120,132,180,.25);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#aab3d8}
.ng .t2{font-size:25px;font-weight:900;color:#9aa4ca;line-height:1.45}
</style></head><body>
<div class="head"><h1>変えるのは、<span class="o ul">1軸だけ</span></h1></div>
<div class="wrap">
  <div class="neon m step"><div class="no">1</div><div>
    <div class="t">競合を3つ開いて、共通点をメモする</div>
    <div class="s">最初の約束／写真／いちばん大きい文字</div></div></div>
  <div class="neon m step"><div class="no">2</div><div>
    <div class="t">このうち、どれか1つだけ変える</div></div></div>
  <div class="neon axes">
    <div class="ax">言葉</div><div class="ax">写真</div><div class="ax">大きさ</div><div class="ax">色</div>
  </div>
  <div class="neon dim ng">
    <div class="x">×</div>
    <div class="t2">全部変える → ブランドの印象と、文字の読みやすさを壊す</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>目的は違う色ではなく、<span class="hl">自分に関係があると気づかせる</span>こと</span></div>
</body></html>
