<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:900px}
.wrap{padding:42px 92px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.card{display:flex;align-items:center;gap:26px;padding:22px 36px}
.no{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#05040f;background:var(--neon);box-shadow:0 0 16px rgba(217,255,61,.65)}
.t{font-size:31px;font-weight:900;line-height:1.35}
.s{font-size:23px;font-weight:800;color:var(--ink2);margin-top:7px}
.ex{padding:24px 36px;margin-top:4px}
.ex .h{font-size:23px;font-weight:900;color:var(--cyan);margin-bottom:12px}
.swatch{display:flex;align-items:center;gap:20px;font-size:27px;font-weight:900}
.sw{width:88px;height:48px;border-radius:10px;flex:none}
.pale{background:#f3cfdb}
.navy{background:#15205e;box-shadow:0 0 16px rgba(35,201,255,.5)}
.arw{color:var(--mag);font-size:26px}
</style></head><body>
<div class="head"><h1>まず「<span class="o ul">違う</span>」をつくる</h1></div>
<div class="wrap">
  <div class="card neon m"><div class="no">1</div><div>
    <div class="t">競合と、真逆の色を使う</div>
    <div class="s">いちばん効きます</div></div></div>
  <div class="card neon m"><div class="no">2</div><div>
    <div class="t">余白を多めに取る</div>
    <div class="s">私は画面の半分以上を目安にしています</div></div></div>
  <div class="card neon m"><div class="no">3</div><div>
    <div class="t">置く場所を、少しずらす</div></div></div>
  <div class="neon ex">
    <div class="h">例：美容系のページ</div>
    <div class="swatch">
      <span class="sw pale"></span><span style="color:#9aa4ca">まわりは淡い色</span>
      <span class="arw">▶</span>
      <span class="sw navy"></span><span>濃い紺を置く</span>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>おしゃれかどうかではなく、<span class="hl">まわりと違うか</span></span></div>
</body></html>
