<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:1000px}
.wrap{padding:44px 110px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:24px}
.card{padding:26px 36px}
.tag{display:inline-block;font-size:21px;font-weight:900;color:#fff;padding:8px 24px;border-radius:999px;margin-bottom:14px}
.b .tag{background:rgba(90,100,150,.9)}
.a .tag{background:linear-gradient(100deg,var(--mag),var(--vio));box-shadow:0 0 14px rgba(240,38,200,.5)}
.msg{font-size:31px;font-weight:900;line-height:1.55}
.b .msg{color:#aeb8da}
.a .msg{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.5)}
.note{margin-top:14px;font-size:23px;font-weight:800;line-height:1.5}
.b .note{color:#8690b8}
.a .note{color:#fff}
</style></head><body>
<div class="head"><h1>「高いなあ」と言われたら、<span class="o ul">何を返すか</span></h1></div>
<div class="wrap">
  <div class="card neon dim b">
    <span class="tag">言いにくい</span>
    <div class="msg">「値下げはできません」</div>
    <div class="note">→ 度胸が要る。ビビりには言えない</div>
  </div>
  <div class="card neon dim b">
    <span class="tag">いつもの</span>
    <div class="msg">「……分かりました」</div>
    <div class="note">→ 次も同じことが起きる</div>
  </div>
  <div class="card neon m a">
    <span class="tag">これだけ</span>
    <div class="msg">「1万円だと、どれを削りましょうか」</div>
    <div class="note">→ 相手が中身を見に行く。「全部要る」と気づく</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>相談の形なので、<span class="hl">強気でなくても言える</span></span></div>
</body></html>
