<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:850px}
.row{display:flex;justify-content:center;gap:44px;padding:52px 90px 0;position:relative;z-index:2}
.col{width:640px;overflow:hidden}
.cap{text-align:center;font-size:28px;font-weight:900;padding:16px 0;color:#fff}
.l .cap{background:linear-gradient(100deg,rgba(90,100,150,.85),rgba(70,80,130,.85))}
.r .cap{background:linear-gradient(100deg,var(--mag),var(--vio))}
.box{padding:24px 30px 26px}
.st{font-size:25px;font-weight:900;padding:12px 0;line-height:1.45;color:#fff}
.l .st{color:#aeb8da}
.ar{font-size:20px;font-weight:900;padding-left:6px;color:rgba(185,196,255,.45)}
.res{margin-top:14px;border-top:1.5px dashed rgba(185,196,255,.3);padding-top:16px;
  font-size:25px;font-weight:900;line-height:1.5}
.l .res{color:#8690b8}
.r .res{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>値下げが起きる、<span class="o ul">2つの場面</span></h1></div>
<div class="row">
  <div class="col neon dim l">
    <div class="cap">思い浮かべるほう</div>
    <div class="box">
      <div class="st">「もう少し安くなりませんか」</div>
      <div class="ar">▼</div>
      <div class="st">しぶしぶ下げる</div>
      <div class="res">交渉術の本が効くのは、<br>こちらだけ</div>
    </div>
  </div>
  <div class="col neon m r">
    <div class="cap">実際に多いほう</div>
    <div class="box">
      <div class="st">誰にも何も言われていない</div>
      <div class="ar" style="color:var(--mag)">▼</div>
      <div class="st">見積書を書きながら、<br>自分で数字を消す</div>
      <div class="res">相手は、下がった値段しか<br>見ていない</div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>交渉の前に、<span class="hl">もう終わっていた</span></span></div>
</body></html>
