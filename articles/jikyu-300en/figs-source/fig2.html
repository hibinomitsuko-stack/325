<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:850px}
.wrap{padding:48px 110px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:28px;padding:24px 34px}
.no{flex:none;width:72px;height:72px;border-radius:50%;color:#fff;font-size:34px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(110deg,var(--mag),var(--vio));box-shadow:0 0 16px rgba(240,38,200,.55)}
.tx h2{font-size:31px;font-weight:900;color:#fff;line-height:1.35}
.tx p{font-size:23px;font-weight:800;color:var(--ink2);margin-top:9px;line-height:1.5}
.hi .no{background:linear-gradient(110deg,var(--neon),#9ad11a);color:#0a0629;box-shadow:0 0 20px rgba(217,255,61,.6)}
.hi .tx h2{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>金額を書く前に、<span class="o ul">紙に3つ</span></h1></div>
<div class="wrap">
  <div class="row neon"><div class="no">1</div><div class="tx">
    <h2>この仕事で、相手の何が変わるか</h2>
    <p>作ったものではなく、そのあとに起きたこと</p></div></div>
  <div class="row neon"><div class="no">2</div><div class="tx">
    <h2>それを自分以外にやるとしたら、何が必要か</h2>
    <p>自分の作業時間ではなく、同じ結果を出すために要るもの</p></div></div>
  <div class="row neon m hi"><div class="no">3</div><div class="tx">
    <h2>削るとしたら、どこから削れるか</h2>
    <p>ここまで書けたら、その金額はもう説明できる</p></div></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>説明できない金額は、<span class="hl">言われたら崩れる</span></span></div>
</body></html>
