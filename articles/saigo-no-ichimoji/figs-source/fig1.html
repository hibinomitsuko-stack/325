<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:1000px}
.wrap{padding:44px 100px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:20px}
.top{padding:24px 40px;display:flex;align-items:center;gap:34px}
.big{font-size:96px;font-weight:900;color:var(--neon);line-height:1;text-shadow:0 0 22px rgba(217,255,61,.6)}
.bt{font-size:25px;font-weight:800;color:var(--ink2);margin-top:6px}
.tt{font-size:29px;font-weight:900;line-height:1.5}
.card{display:flex;align-items:center;gap:26px;padding:22px 38px}
.no{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;color:#05040f;background:var(--neon);box-shadow:0 0 16px rgba(217,255,61,.65)}
.t{font-size:32px;font-weight:900}
.x{margin-top:4px;text-align:center;font-size:26px;font-weight:900;color:#8690b8;position:relative;z-index:2}
</style></head><body>
<div class="head"><h1>数えたのは、<span class="o ul">3つだけ</span></h1></div>
<div class="wrap">
  <div class="neon m top">
    <div><div class="big">485</div><div class="bt">本（スレッドの1投稿目）</div></div>
    <div class="tt">内容の良し悪しは数えていない。<br><b style="color:var(--neon)">形だけ</b>を数えました</div>
  </div>
  <div class="card neon"><div class="no">1</div><div class="t">文字数</div></div>
  <div class="card neon"><div class="no">2</div><div class="t">改行の数</div></div>
  <div class="card neon"><div class="no">3</div><div class="t">最後の1文字</div></div>
  <div class="x">差が出ていたのは、1番ではありませんでした</div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>見たのは、書き出しではなく<span class="hl">終わり方</span></span></div>
</body></html>
