<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:960px}
.wrap{padding:44px 96px 0;position:relative;z-index:2}
.sheet{padding:30px 44px 32px}
.ttl{font-size:25px;font-weight:900;color:var(--neon);margin-bottom:20px}
.row{display:flex;align-items:center;gap:24px;padding:16px 0;border-bottom:1.5px dashed rgba(185,196,255,.22)}
.row:last-of-type{border-bottom:0}
.n{font-size:26px;font-weight:900;color:var(--mag);flex:none;width:130px}
.ln{flex:1;border-bottom:2.5px dotted rgba(185,196,255,.5);height:30px}
.mk{flex:none;width:200px;text-align:center;font-size:34px;font-weight:900;color:#e8ecff;letter-spacing:.06em}
.mk i{font-style:normal;color:#7b86b0;font-size:26px;margin:0 10px}
.hint{margin-top:22px;padding-top:20px;border-top:1.5px dashed rgba(185,196,255,.3);
  font-size:25px;font-weight:900;color:#fff;line-height:1.6}
.hint b{color:var(--neon)}
</style></head><body>
<div class="head"><h1>直近5投稿の、<span class="o ul">最後の1文字</span></h1></div>
<div class="wrap">
  <div class="sheet neon m">
    <div class="ttl">本文は読まなくていい。最後の1文字だけ見る（3分）</div>
    <div class="row"><div class="n">1本前</div><div class="ln"></div><div class="mk">。<i>or</i>、</div></div>
    <div class="row"><div class="n">2本前</div><div class="ln"></div><div class="mk">。<i>or</i>、</div></div>
    <div class="row"><div class="n">3本前</div><div class="ln"></div><div class="mk">。<i>or</i>、</div></div>
    <div class="row"><div class="n">4本前</div><div class="ln"></div><div class="mk">。<i>or</i>、</div></div>
    <div class="row"><div class="n">5本前</div><div class="ln"></div><div class="mk">。<i>or</i>、</div></div>
    <div class="hint">「、」が<b>3つ以上</b>なら、そこが直す場所です。<br>直すのは、1本だけで大丈夫です。</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>今日は、<span class="hl">1本直せたら</span>終わりです</span></div>
</body></html>
