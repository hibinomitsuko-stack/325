<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:840px}
.wrap{display:flex;gap:40px;padding:44px 90px 0;position:relative;z-index:2}
.col{flex:1;border-radius:22px;overflow:hidden}
.cap{font-size:28px;font-weight:900;text-align:center;padding:16px 0}
.dim .cap{background:rgba(120,132,180,.3);color:#cfd6f5}
.m .cap{background:linear-gradient(100deg,var(--mag),var(--vio));color:#fff}
.body{padding:30px 34px 32px;text-align:center}
.mark{font-size:46px;font-weight:900;line-height:1.3;padding:18px 0}
.mark .pt{font-size:76px;vertical-align:-10px}
.m .mark{color:var(--neon);text-shadow:0 0 24px rgba(217,255,61,.6)}
.dim .mark{color:#7f89b4}
.num{font-size:40px;font-weight:900;margin-top:14px}
.m .num{color:#fff}.dim .num{color:#9aa4ca}
.sub{font-size:24px;font-weight:800;color:var(--ink2);margin-top:10px;line-height:1.5}
.res{margin-top:20px;padding-top:18px;border-top:1.5px dashed rgba(185,196,255,.3);font-size:27px;font-weight:900}
.m .res{color:var(--neon)}.dim .res{color:#8690b8}
</style></head><body>
<div class="head"><h1>差が出ていたのは、<span class="o ul">最後の1文字</span></h1></div>
<div class="wrap">
  <div class="col neon m">
    <div class="cap">いちばん読まれた15本</div>
    <div class="body">
      <div class="mark">…落ちました<span class="pt">。</span></div>
      <div class="num">15本 / 15本</div>
      <div class="sub">全部、句点で終わっていた</div>
      <div class="res">文として終わっている</div>
    </div>
  </div>
  <div class="col neon dim">
    <div class="cap">「、」で終わっていた投稿</div>
    <div class="body">
      <div class="mark">…ですが<span class="pt">、</span></div>
      <div class="num">47本</div>
      <div class="sub">この中に、上位は1本もなし</div>
      <div class="res">途中で切っている</div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>直すのは書き出しではなく、<span class="hl">終わり方</span>かもしれない</span></div>
</body></html>
