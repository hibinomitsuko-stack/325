<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:760px}
.wrap{padding:46px 100px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:30px;padding:28px 40px}
.lb{font-size:27px;font-weight:900;flex:none;width:300px;line-height:1.4}
.dim .lb{color:#9aa4ca}
.bar{height:46px;border-radius:10px;flex:none}
.m .bar{background:linear-gradient(90deg,var(--vio),var(--mag));box-shadow:0 0 18px rgba(240,38,200,.55)}
.dim .bar{background:#5d6punkt}
.dim .bar{background:#525d87}
.v{font-size:40px;font-weight:900;margin-left:auto;white-space:nowrap}
.m .v{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.6)}
.dim .v{color:#8690b8}
.note{margin-top:6px;text-align:center;font-size:27px;font-weight:900;color:#fff;position:relative;z-index:2}
.note b{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>改行があるかないかで、<span class="o ul">倍近く</span></h1></div>
<div class="wrap">
  <div class="neon dim row">
    <div class="lb">改行なし<br><span style="font-size:22px">（485本中 98本）</span></div>
    <div class="bar" style="width:300px"></div>
    <div class="v">1,278 回</div>
  </div>
  <div class="neon m row">
    <div class="lb">改行あり</div>
    <div class="bar" style="width:580px"></div>
    <div class="v">2,000〜2,600 回</div>
  </div>
  <div class="note">スレッドの1投稿目が、見られた回数の<b>中央値</b></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>読む前に、<span class="hl">長さだけ</span>で判断されている</span></div>
</body></html>
