<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:760px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:50px 110px 0;position:relative;z-index:2}
.c{padding:28px 32px;display:flex;align-items:center;gap:24px}
.no{flex:none;width:64px;height:64px;border-radius:50%;color:#fff;font-size:30px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(110deg,var(--mag),var(--vio));box-shadow:0 0 16px rgba(240,38,200,.55)}
.tx h2{font-size:30px;font-weight:900;color:#fff;line-height:1.35}
.tx p{font-size:21px;font-weight:800;color:var(--ink2);margin-top:8px;line-height:1.45}
.note{margin:26px 110px 0;text-align:center;font-size:26px;font-weight:900;color:var(--neon);
  text-shadow:0 0 14px rgba(217,255,61,.5);position:relative;z-index:2;line-height:1.5}
</style></head><body>
<div class="head"><h1>相手が確かめている、<span class="o ul">4つ</span></h1></div>
<div class="g">
  <div class="c neon"><div class="no">1</div><div class="tx">
    <h2>いくらかかるか</h2><p>金額だけでなく、中身も</p></div></div>
  <div class="c neon"><div class="no">2</div><div class="tx">
    <h2>どれくらいで終わるか</h2><p>納品日が怖いなら「着手から◯日で初稿」</p></div></div>
  <div class="c neon"><div class="no">3</div><div class="tx">
    <h2>何を渡せばいいか</h2><p>素材・文章・ログイン情報</p></div></div>
  <div class="c neon m"><div class="no">4</div><div class="tx">
    <h2>途中で何回やりとりするか</h2><p>ここを言う人が、いちばん少ない</p></div></div>
</div>
<div class="note">4つそろえば、相手は一人で決められます。会話はいりません。</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>1つ欠けると、<span class="hl">「検討します」になる</span></span></div>
</body></html>
