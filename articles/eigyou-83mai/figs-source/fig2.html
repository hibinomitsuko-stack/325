<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:850px}
.row{display:flex;justify-content:center;gap:44px;padding:52px 90px 0;position:relative;z-index:2}
.col{width:640px;overflow:hidden}
.cap{text-align:center;font-size:29px;font-weight:900;padding:16px 0;color:#fff}
.l .cap{background:linear-gradient(100deg,rgba(90,100,150,.85),rgba(70,80,130,.85))}
.r .cap{background:linear-gradient(100deg,var(--mag),var(--vio))}
.box{padding:26px 32px 28px}
.q{font-size:32px;font-weight:900;line-height:1.5;text-align:center;padding:14px 0 20px}
.l .q{color:#aeb8da}
.r .q{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.5)}
li{list-style:none;font-size:24px;font-weight:800;line-height:1.5;padding:14px 0 14px 40px;position:relative;
  border-top:1.5px dashed rgba(185,196,255,.28)}
li::before{content:"";position:absolute;left:6px;top:20px;width:16px;height:16px;border-radius:50%}
.l li{color:#99a4c9}
.l li::before{background:#6b7aa8}
.r li{color:#fff}
.r li::before{background:var(--mag);box-shadow:0 0 10px rgba(240,38,200,.9)}
</style></head><body>
<div class="head"><h1>人が頼むのは、<span class="o ul">どちらか</span></h1></div>
<div class="row">
  <div class="col neon dim l">
    <div class="cap">増やそうとしていたもの</div>
    <div class="box">
      <div class="q">好かれるから<br>頼んでくれる</div>
      <ul><li>もっと話す</li><li>もっと笑う</li><li>もっと会う</li></ul>
    </div>
  </div>
  <div class="col neon m r">
    <div class="cap">実際に動かしていたもの</div>
    <div class="box">
      <div class="q">決められるから<br>頼んでくれる</div>
      <ul><li>いくらかが分かる</li><li>いつ終わるかが分かる</li><li>何を渡すかが分かる</li></ul>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>分からないものは、<span class="hl">頼めない</span></span></div>
</body></html>
