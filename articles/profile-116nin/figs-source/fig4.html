<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px}
.sheet{margin:46px 110px 0;padding:30px 42px 34px;position:relative;z-index:2}
.row{display:flex;align-items:flex-start;gap:26px;padding:22px 0}
.row+.row{border-top:1.5px dashed rgba(185,196,255,.3)}
.lb{flex:none;width:150px;height:56px;border-radius:14px;color:#fff;font-size:23px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(110deg,var(--mag),var(--vio));box-shadow:0 0 14px rgba(240,38,200,.5)}
.bd{flex:1}
.ln{height:46px;border-bottom:3px dotted rgba(185,196,255,.55);margin-bottom:9px}
.hint{font-size:21px;font-weight:800;color:var(--ink2);line-height:1.5}
.tail{margin-top:20px;font-size:22px;font-weight:800;color:var(--ink2);line-height:1.6}
.tail b{color:var(--neon)}
</style></head><body>
<div class="head"><h1>プロフィール<span class="o ul">書き換えシート</span></h1></div>
<div class="sheet neon">
  <div class="row"><div class="lb">1行目</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">相手が今日ため息をついた理由。肩書きではなく、困りごとの言葉で</div></div></div>
  <div class="row"><div class="lb">2行目</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">そこから抜けた事実。ここに経歴を回す（消さない）</div></div></div>
  <div class="row"><div class="lb">3行目</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">受け取れるもの、1つだけ。無料のものを一番上に置く</div></div></div>
  <div class="tail">後ろに回すものを1つ決める　→　<b>　　　　　　　　　　　　　　　　　</b>（たいてい、いちばん気に入っている一行）</div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>今日は <span class="hl">1行目</span> が書けたら終わりです</span></div>
</body></html>
