<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:840px}
.wrap{padding:52px 150px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:30px;padding:22px 36px}
.v{flex:none;width:300px;font-size:52px;font-weight:900;text-align:right;line-height:1.1}
.lb{font-size:27px;font-weight:800;color:#fff}
.s1 .v{color:#8fc9ff}
.s2 .v{color:var(--mag);text-shadow:0 0 18px rgba(240,38,200,.6)}
.s3 .v{color:var(--neon);text-shadow:0 0 20px rgba(217,255,61,.7)}
.ar{display:flex;align-items:center;gap:16px;padding-left:326px;position:relative;z-index:2}
.ar .t{font-size:30px;font-weight:900}
.a1 .t{color:#8fc9ff}
.a2 .t{color:var(--neon)}
.ar .n{font-size:22px;font-weight:800;color:var(--ink2)}
</style></head><body>
<div class="head"><h1>止まっていたのは、<span class="o ul">投稿の先</span></h1></div>
<div class="wrap">
  <div class="step neon dim s1"><div class="v">154,846</div><div class="lb">人が投稿を見た</div></div>
  <div class="ar a1"><span class="t">▼ 14.0%</span><span class="n">ここは効いていた（いちばん高い遷移率）</span></div>
  <div class="step neon m s2"><div class="v">21,737</div><div class="lb">人がプロフィールを開いた</div></div>
  <div class="ar a2"><span class="t">▼</span><span class="n">ここで止まっていた（1%に届かない）</span></div>
  <div class="step neon s3"><div class="v">116</div><div class="lb">人がフォローした</div></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>直すのは水の量ではなく、<span class="hl">バケツのほう</span></span></div>
</body></html>
