<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px}
.wrap{padding:48px 110px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:28px;padding:22px 34px}
.no{flex:none;width:96px;height:62px;border-radius:14px;color:#fff;font-size:25px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(110deg,var(--mag),var(--vio));box-shadow:0 0 16px rgba(240,38,200,.55)}
.tx h2{font-size:30px;font-weight:900;color:var(--neon);line-height:1.35;text-shadow:0 0 12px rgba(217,255,61,.5)}
.tx p{font-size:25px;font-weight:800;color:#fff;margin-top:10px;line-height:1.5}
.tx .ex{font-size:22px;font-weight:800;color:var(--ink2);margin-top:8px;line-height:1.5}
.last{text-align:center;font-size:26px;font-weight:900;color:var(--ink2);margin-top:4px}
</style></head><body>
<div class="head"><h1>プロフィールは、<span class="o ul">3行</span>で足ります</h1></div>
<div class="wrap">
  <div class="row neon"><div class="no">1行目</div><div class="tx">
    <h2>相手が今、困っていること</h2>
    <div class="ex">例）営業ゼロ、センスなし、ビビり、自信ゼロ。</div></div></div>
  <div class="row neon"><div class="no">2行目</div><div class="tx">
    <h2>そこから抜けた事実</h2>
    <div class="ex">例）18ヶ月でクビ → 1年間、案件ゼロ → 独学で200件 → 8年で300社</div></div></div>
  <div class="row neon m"><div class="no">3行目</div><div class="tx">
    <h2>受け取れるもの、1つだけ</h2>
    <div class="ex">例）「選ばれる理由」の作り方を、ここで毎日書いています。</div></div></div>
  <div class="last">すごい経歴は、消さずに <span style="color:var(--neon)">2行目へ回す</span></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>1行目が決まらないと、<span class="hl">残り2行も決まらない</span></span></div>
</body></html>
