<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px}
.wrap{padding:42px 96px 0;position:relative;z-index:2}
.sheet{padding:28px 44px 30px}
.ttl{font-size:24px;font-weight:900;color:var(--neon);margin-bottom:18px}
.row{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:1.5px dashed rgba(185,196,255,.2)}
.row:last-of-type{border-bottom:0}
.k{font-size:25px;font-weight:900;flex:none;width:330px;line-height:1.35}
.ln{flex:1;border-bottom:2.5px dotted rgba(185,196,255,.5);height:30px}
.sep{margin:18px 0 10px;padding-top:16px;border-top:1.5px dashed rgba(185,196,255,.3);
  font-size:24px;font-weight:900;color:var(--cyan)}
.chk{display:flex;align-items:center;gap:15px;font-size:24px;font-weight:800;color:#e8ecff;padding:8px 0}
.box{width:24px;height:24px;border:2.5px solid var(--cyan);border-radius:6px;flex:none}
.date{margin-top:16px;padding-top:16px;border-top:1.5px dashed rgba(185,196,255,.3);
  display:flex;align-items:center;gap:22px}
.date .k2{font-size:27px;font-weight:900;color:var(--neon);flex:none}
.date .ln2{flex:1;border-bottom:2.5px dotted rgba(217,255,61,.6);height:34px}
</style></head><body>
<div class="head"><h1>残す1つと、<span class="o ul">応募する日</span></h1></div>
<div class="wrap">
  <div class="sheet neon m">
    <div class="ttl">今できることを書き出して、1つだけ丸をつける（5分）</div>
    <div class="row"><div class="k">残す1つ</div><div class="ln"></div></div>
    <div class="row"><div class="k">いったん置いておくもの</div><div class="ln"></div></div>
    <div class="sep">3つの基準で確かめる（7分）</div>
    <div class="chk"><span class="box"></span>そのツールだけで完結する仕事があるか</div>
    <div class="chk"><span class="box"></span>検索して、未経験可が混ざっているか</div>
    <div class="chk"><span class="box"></span>黙って3時間さわれるか</div>
    <div class="date"><div class="k2">応募する日（2週間後）</div><div class="ln2"></div></div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>今日は、<span class="hl">日付を書くまで</span>で終わりです</span></div>
</body></html>
