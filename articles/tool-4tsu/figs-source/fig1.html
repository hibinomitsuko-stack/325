<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:800px}
.wrap{display:flex;gap:38px;padding:44px 90px 0;position:relative;z-index:2}
.col{flex:1;border-radius:22px;overflow:hidden}
.cap{font-size:28px;font-weight:900;text-align:center;padding:16px 0}
.m .cap{background:linear-gradient(100deg,var(--mag),var(--vio));color:#fff}
.dim .cap{background:rgba(120,132,180,.3);color:#cfd6f5}
.body{padding:24px 32px 28px}
.it{display:flex;align-items:center;gap:16px;font-size:27px;font-weight:800;padding:16px 0;
  border-bottom:1.5px dashed rgba(185,196,255,.22)}
.it:last-of-type{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.m .dot{background:var(--mag);box-shadow:0 0 12px rgba(240,38,200,.9)}
.dim .dot{background:#7f89b4}
.dim .it{color:#aab3d8}
.res{margin-top:14px;padding-top:16px;border-top:1.5px dashed rgba(185,196,255,.3);
  text-align:center;font-size:27px;font-weight:900}
.m .res{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.55)}
.dim .res{color:#8690b8}
</style></head><body>
<div class="head"><h1>13ヶ月で、<span class="o ul">増えたもの</span></h1></div>
<div class="wrap">
  <div class="col neon m">
    <div class="cap">増えた</div>
    <div class="body">
      <div class="it"><span class="dot"></span>できることの数（4つ）</div>
      <div class="it"><span class="dot"></span>勉強した時間</div>
      <div class="it"><span class="dot"></span>模写（100個）</div>
      <div class="res">全部、自分の側の変化</div>
    </div>
  </div>
  <div class="col neon dim">
    <div class="cap">増えなかった</div>
    <div class="body">
      <div class="it"><span class="dot"></span>案件</div>
      <div class="it"><span class="dot"></span>問い合わせ</div>
      <div class="it"><span class="dot"></span>相手に起きたこと</div>
      <div class="res">13ヶ月で、0件</div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>勉強は、<span class="hl">誰にも断られない</span>作業だった</span></div>
</body></html>
