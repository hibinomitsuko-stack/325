<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px}
.wrap{padding:44px 96px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:22px}
.card{padding:26px 40px}
.lb{font-size:24px;font-weight:900;margin-bottom:14px}
.m .lb{color:var(--neon)}.dim .lb{color:#8690b8}
.q{font-size:31px;font-weight:900;line-height:1.45}
.dim .q{color:#9aa4ca}
.res{margin-top:16px;padding-top:16px;border-top:1.5px dashed rgba(185,196,255,.3);font-size:26px;font-weight:900}
.dim .res{color:#8690b8}
.m .res{color:#fff}
.m .res b{color:var(--neon)}
</style></head><body>
<div class="head"><h1>相手が読んで、<span class="o ul">判断できる</span>のは</h1></div>
<div class="wrap">
  <div class="card neon dim">
    <div class="lb">できることの一覧</div>
    <div class="q">「Illustrator、Photoshop、WordPress、LP制作、できます」</div>
    <div class="res">自分の案件に当てはめる作業は、相手がやることになる</div>
  </div>
  <div class="card neon m">
    <div class="lb">1件、最後まで出したもの</div>
    <div class="q">「飲食店のメニューを3枚つくりました」</div>
    <div class="res">近いかどうかが <b>すぐ分かる</b></div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>数が多いほど親切だと思っていたら、<span class="hl">逆</span>だった</span></div>
</body></html>
