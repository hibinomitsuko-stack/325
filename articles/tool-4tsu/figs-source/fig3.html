<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:840px}
.wrap{padding:42px 92px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.card{display:flex;align-items:center;gap:28px;padding:24px 36px}
.no{width:66px;height:66px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;color:#05040f;box-shadow:0 0 16px rgba(0,0,0,.4)}
.c1 .no{background:var(--neon)}.c2 .no{background:var(--cyan)}.c3 .no{background:var(--mag)}
.tx .t{font-size:32px;font-weight:900;line-height:1.35}
.tx .s{font-size:23px;font-weight:800;color:var(--ink2);margin-top:8px;line-height:1.45}
.note{margin-top:6px;text-align:center;font-size:26px;font-weight:900;color:#fff;position:relative;z-index:2;line-height:1.5}
.note b{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>残す1つを選ぶ、<span class="o ul">3つの基準</span></h1></div>
<div class="wrap">
  <div class="card neon m c1"><div class="no">1</div><div class="tx">
    <div class="t">そのツールだけで、完結する仕事があるか</div>
    <div class="s">途中で別のツールが要るものを選ぶと、また勉強が増える</div></div></div>
  <div class="card neon c2"><div class="no">2</div><div class="tx">
    <div class="t">実際に、仕事として募集されているか</div>
    <div class="s">件数／「未経験可」が混ざっているか／締め切りが近いもの</div></div></div>
  <div class="card neon c3"><div class="no">3</div><div class="tx">
    <div class="t">黙って3時間、さわれるか</div>
    <div class="s">苦痛なものは続かない</div></div></div>
  <div class="note">順番が大事。<b>①と②を満たすものが複数あったときだけ</b>、③で決める</div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>③から選ぶと、<span class="hl">市場にない道具</span>を選ぶ</span></div>
</body></html>
