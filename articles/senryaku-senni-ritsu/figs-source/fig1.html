<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");

.row{display:flex;justify-content:center;gap:44px;padding:52px 90px 0;position:relative;z-index:2}
.col{width:640px;overflow:hidden}
.cap{text-align:center;font-size:29px;font-weight:900;padding:16px 0;color:#fff}
.l .cap{background:linear-gradient(100deg,rgba(35,201,255,.9),rgba(59,130,246,.9))}
.r .cap{background:linear-gradient(100deg,var(--mag),var(--vio))}

.n{text-align:center;padding:12px 0 4px}
.n .lb{font-size:21px;font-weight:800;color:var(--ink2)}
.n .v{font-size:56px;font-weight:900;line-height:1.1;margin-top:2px}
.l .n .v{color:#8fc9ff}
.r .n .v{color:var(--neon);text-shadow:0 0 18px rgba(217,255,61,.6)}
.n .u{font-size:26px}
.rate{margin:14px 22px 22px;border-top:1.5px dashed rgba(185,196,255,.3);padding-top:16px;text-align:center;
  font-size:34px;font-weight:900}
.l .rate{color:#8fc9ff}
.r .rate{color:var(--neon);text-shadow:0 0 16px rgba(217,255,61,.6)}
</style></head><body>
<div class="head"><h1>同じ月の、<span class="o ul">2つの投稿</span></h1></div>

  </div>
  <div class="col neon m r">

</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>閲覧は3.4倍。動いた人は <span class="hl">23倍</span></span></div>
