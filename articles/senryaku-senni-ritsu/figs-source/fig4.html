<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:770px}
.sheet{margin:46px 110px 0;padding:30px 40px 34px;position:relative;z-index:2}
table{width:100%;border-collapse:collapse}
th{font-size:24px;font-weight:900;color:var(--neon);padding:0 10px 16px;text-align:left;
  text-shadow:0 0 12px rgba(217,255,61,.55)}
th.c,td.c{text-align:center}
td{font-size:26px;font-weight:800;color:#fff;padding:20px 10px;border-top:1.5px dashed rgba(185,196,255,.3)}
.ln{height:40px;border-bottom:3px dotted rgba(185,196,255,.55)}
.no{color:var(--ink2);font-size:24px}
.hint{margin-top:20px;font-size:22px;font-weight:800;color:var(--ink2);line-height:1.6}
.hint b{color:var(--neon)}
</style></head><body>
<div class="head"><h1>遷移率<span class="o ul">チェックシート</span></h1></div>
<div class="sheet neon">
  <table>
    <tr><th>投稿</th><th class="c">閲覧数</th><th class="c">プロフィール</th><th class="c">遷移率</th></tr>
    <tr><td class="no">直近1本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
    <tr><td class="no">直近2本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
    <tr><td class="no">直近3本目</td><td><div class="ln"></div></td><td><div class="ln"></div></td><td><div class="ln"></div></td></tr>
  </table>
  <div class="hint">プロフィール ÷ 閲覧数 ＝ 遷移率　／　<b>10%以上</b> 勝ち　<b>4〜10%</b> 合格　<b>4%未満</b> 閲覧が何万でも負け</div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>今日は <span class="hl">3本の割り算</span> だけで終わりです</span></div>
</body></html>
