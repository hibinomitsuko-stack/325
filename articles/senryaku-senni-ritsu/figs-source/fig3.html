<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px}
.row{display:flex;justify-content:center;gap:44px;padding:50px 90px 0;position:relative;z-index:2}
.col{width:640px;overflow:hidden}
.cap{text-align:center;font-size:29px;font-weight:900;padding:16px 0;color:#fff}
.l .cap{background:linear-gradient(100deg,rgba(90,100,150,.85),rgba(70,80,130,.85))}
.r .cap{background:linear-gradient(100deg,var(--mag),var(--vio))}
.box{padding:24px 30px 26px}
.st{font-size:26px;font-weight:900;padding:12px 0;line-height:1.4}
.l .st{color:#99a4c9}
.ar{font-size:21px;font-weight:900;padding-left:6px;color:rgba(185,196,255,.5)}
.big{text-align:center;margin-top:10px;border-top:1.5px dashed rgba(185,196,255,.3);padding-top:18px}
.big .v{font-size:58px;font-weight:900;line-height:1.1}
.l .big .v{color:#7f8cb8}
.r .big .v{color:var(--neon);text-shadow:0 0 18px rgba(217,255,61,.6)}
.big .lb{font-size:21px;font-weight:800;color:var(--ink2);margin-top:6px}
</style></head><body>
<div class="head"><h1>告知は、<span class="o ul">単独で出さない</span></h1></div>
<div class="row">
  <div class="col neon dim l">
    <div class="cap">告知だけを1本で出す</div>
    <div class="box">
      <div class="st">【本日◯◯開催】</div>
      <div class="ar">▼</div>
      <div class="st">読む理由がない</div>
      <div class="big"><div class="v">195</div><div class="lb">閲覧（同じ週の実測）</div></div>
    </div>
  </div>
  <div class="col neon m r">
    <div class="cap">伸びた投稿の返信に置く</div>
    <div class="box">
      <div class="st" style="color:#fff">1投稿目：本編</div>
      <div class="ar" style="color:var(--mag)">▼</div>
      <div class="st" style="color:#fff">2投稿目：答え＋案内</div>
      <div class="big"><div class="v">154,846</div><div class="lb">親の投稿が運んでくれる</div></div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>502本のうち <span class="hl">330本</span> が、導線なしで終わっていました</span></div>
</body></html>
