<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px}
.wrap{display:flex;gap:40px;padding:42px 86px 0;position:relative;z-index:2}
.col{flex:1;border-radius:22px;overflow:hidden}
.cap{font-size:30px;font-weight:900;text-align:center;padding:16px 0}
.dim .cap{background:rgba(120,132,180,.3);color:#cfd6f5}
.m .cap{background:linear-gradient(100deg,var(--mag),var(--vio));color:#fff}
.body{padding:26px 34px 30px}
.it{display:flex;align-items:center;gap:16px;font-size:27px;font-weight:800;padding:15px 0;
  border-bottom:1.5px dashed rgba(185,196,255,.22)}
.it:last-of-type{border-bottom:0}
.dot{width:15px;height:15px;border-radius:50%;flex:none}
.dim .dot{background:#7f89b4}.m .dot{background:var(--mag);box-shadow:0 0 12px rgba(240,38,200,.9)}
.dim .it{color:#aab3d8}
.res{margin-top:16px;padding-top:18px;border-top:1.5px dashed rgba(185,196,255,.3);
  text-align:center;font-size:30px;font-weight:900}
.dim .res{color:#8690b8}
.m .res{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.6)}
</style></head><body>
<div class="head"><h1>直していた場所と、<span class="o ul">見られていた場所</span></h1></div>
<div class="wrap">
  <div class="col neon dim">
    <div class="cap">1年かけて直していた</div>
    <div class="body">
      <div class="it"><span class="dot"></span>作品の配色</div>
      <div class="it"><span class="dot"></span>作品の並び順</div>
      <div class="it"><span class="dot"></span>サイトのデザイン</div>
      <div class="it"><span class="dot"></span>PDF版の用意</div>
      <div class="res">1年で、0件</div>
    </div>
  </div>
  <div class="col neon m">
    <div class="cap">相手が見ていた</div>
    <div class="body">
      <div class="it"><span class="dot"></span>応募文</div>
      <div class="it"><span class="dot"></span>最初の返信</div>
      <div class="it"><span class="dot"></span>見積もりの出し方</div>
      <div class="it"><span class="dot"></span>次に何が起きるかの説明</div>
      <div class="res">ここで決まっていた</div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>作品集は、<span class="hl">開かれない場所</span>だった</span></div>
</body></html>
