<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:900px}
.wrap{padding:42px 96px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:22px}
.card{padding:26px 40px}
.lb{font-size:24px;font-weight:900;margin-bottom:14px}
.m .lb{color:var(--neon)}
.dim .lb{color:#8690b8}
.q{font-size:32px;font-weight:900;line-height:1.5}
.dim .q{color:#9aa4ca}
.res{margin-top:16px;padding-top:16px;border-top:1.5px dashed rgba(185,196,255,.3);
  font-size:26px;font-weight:900}
.dim .res{color:#8690b8}
.m .res{color:#fff}
.m .res b{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.6)}
</style></head><body>
<div class="head"><h1>決め手は、作品ではなく<span class="o ul">最初の1行</span></h1></div>
<div class="wrap">
  <div class="card neon dim">
    <div class="lb">8年前に送っていた文</div>
    <div class="q">「LP制作できます。こちらがポートフォリオです。」</div>
    <div class="res">122件応募 → 決まったのは 0件</div>
  </div>
  <div class="card neon m">
    <div class="lb">実際に決め手になった文</div>
    <div class="q">「御社の商品、スマホだと一番伝えたい魅力が<br>途中で消えてしまっているのが、少しもったいないと感じました」</div>
    <div class="res">添えた作品 <b>0枚</b>　／　「詳しく聞かせてください」</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>120万円の作品集を見せた回数は、<span class="hl">8年でゼロ</span></span></div>
</body></html>
