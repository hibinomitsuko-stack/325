<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:900px}
.wrap{padding:44px 96px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:20px}
.card{display:flex;align-items:center;gap:30px;padding:26px 38px}
.no{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;color:#05040f;background:var(--neon);box-shadow:0 0 18px rgba(217,255,61,.7)}
.tx .t{font-size:33px;font-weight:900;line-height:1.35}
.tx .s{font-size:24px;font-weight:800;color:var(--ink2);margin-top:8px;line-height:1.45}
.note{margin-top:6px;text-align:center;font-size:27px;font-weight:900;color:#fff;position:relative;z-index:2}
.note b{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>作品の代わりに、<span class="o ul">見られているもの</span></h1></div>
<div class="wrap">
  <div class="card neon m"><div class="no">1</div><div class="tx">
    <div class="t">この先、どう進むのかが見えるか</div>
    <div class="s">次に何が起きて、いつ何が決まるのか</div></div></div>
  <div class="card neon m"><div class="no">2</div><div class="tx">
    <div class="t">自分が何を準備すればいいか分かるか</div>
    <div class="s">「素材をください」ではなく、何を・どの形で・いつまでに</div></div></div>
  <div class="card neon m"><div class="no">3</div><div class="tx">
    <div class="t">質問が、相手の仕事の話になっているか</div>
    <div class="s">「ご予算は」だけ ／ 「これは誰に見せるものですか」</div></div></div>
  <div class="note">この3つは、<b>作品が1点もなくても書けます</b></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>選ばれているのは、作品ではなく<span class="hl">進め方</span></span></div>
</body></html>
