<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:980px}
.wrap{padding:46px 96px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.card{display:flex;align-items:center;gap:30px;padding:26px 38px}
.no{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#05040f;background:var(--neon);box-shadow:0 0 18px rgba(217,255,61,.7)}
.tx .t{font-size:33px;font-weight:900;line-height:1.35}
.tx .s{font-size:23px;font-weight:800;color:var(--ink2);margin-top:7px}
.ar{text-align:center;font-size:26px;font-weight:900;color:var(--mag);line-height:1}
.note{margin-top:10px;text-align:center;font-size:26px;font-weight:900;color:#fff;position:relative;z-index:2}
.note b{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>作品を見てもらえる、<span class="o ul">順番</span></h1></div>
<div class="wrap">
  <div class="card neon m"><div class="no">1</div><div class="tx">
    <div class="t">1行で「分かってる？」に答える</div>
    <div class="s">作品は添えない</div></div></div>
  <div class="ar">▼</div>
  <div class="card neon m"><div class="no">2</div><div class="tx">
    <div class="t">「詳しく聞かせてください」と言われる</div>
    <div class="s">ここで初めて、話が始まる</div></div></div>
  <div class="ar">▼</div>
  <div class="card neon"><div class="no">3</div><div class="tx">
    <div class="t">そこで、作品を1〜2個だけ見てもらう</div>
    <div class="s">案件に近いものだけ。50個はいらない</div></div></div>
  <div class="note">ポートフォリオは入口ではなく、<b>あとで安心するために見るもの</b></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>私は、<span class="hl">3番だけ</span>を8年前に磨いていた</span></div>
</body></html>
