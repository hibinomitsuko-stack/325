<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:740px;overflow:hidden}
.row{display:flex;justify-content:center;gap:30px;padding:56px 70px 0}
.card{background:#fff;border:2.5px solid #f4b271;border-radius:24px;padding:30px 24px 26px;
  box-shadow:0 12px 26px rgba(190,130,50,.10);width:382px;text-align:center}
.ic{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:#fdecda;color:#f5822b;
  display:flex;align-items:center;justify-content:center}
.ic svg{width:44px;height:44px}
.no{font-size:24px;font-weight:900;color:#f5822b}
.ttl{font-size:30px;font-weight:900;margin:8px 0 14px;line-height:1.4}
.ex{font-size:21px;font-weight:800;color:#7b8292;line-height:1.6;text-align:left;
  border-top:1.5px dashed #e4d7c4;padding-top:14px}
</style></head><body>
<div class="head"><h1>実績の、<span class="o ul">3つの数え方</span></h1></div>
<div class="row">
  <div class="card">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><path d="M24 41S7 30 7 19a9 9 0 0117-4 9 9 0 0117 4c0 11-17 22-17 22z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <div class="no">①</div>
    <div class="ttl">仕事の外で<br>解いた困りごと</div>
    <div class="ex">前職の資料／友人の店／<br>学校のおたより</div>
  </div>
  <div class="card">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><path d="M12 40c0-7 9-7 9-14S12 19 12 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="12" cy="40" r="3.5" fill="currentColor"/><path d="M30 10v28" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M30 11h11l-3.5 5.5L41 22H30z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <div class="no">②</div>
    <div class="ttl">自分が<br>通った道そのもの</div>
    <div class="ex">遠回りした／言えなかった／<br>通ったのに来なかった</div>
  </div>
  <div class="card">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><path d="M31 9l8 8-20 20-10 2 2-10L31 9z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <div class="no">③</div>
    <div class="ttl">すでに作ったものを<br>書き直す</div>
    <div class="ex">練習作／モニター／<br>架空の課題</div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>新しく作らなくても、<span style="color:#1B2A4A">今日書ける</span></span>
</div>
</body></html>
