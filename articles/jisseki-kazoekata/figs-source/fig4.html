<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:800px;overflow:hidden}
.wrap{padding:52px 100px 0;display:flex;flex-direction:column;gap:20px}
.step{display:flex;align-items:center;gap:28px;background:#fff;border:2.5px solid #f4b271;border-radius:22px;
  padding:24px 34px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.no{flex:none;width:78px;height:78px;border-radius:50%;background:#f5822b;color:#fff;
  font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tx h2{font-size:31px;font-weight:900;color:#1B2A4A;line-height:1.4}
.tx p{font-size:24px;font-weight:800;color:#7b8292;margin-top:8px;line-height:1.5}
.hint{margin-top:4px;text-align:center;font-size:25px;font-weight:900;color:#1B2A4A}
</style></head><body>
<div class="head"><h1>実績ゼロのときに書く、<span class="o ul">3行</span></h1></div>
<div class="wrap">
  <div class="step">
    <div class="no">誰の</div>
    <div class="tx"><h2>予約が埋まらない小さなサロンの方の、</h2>
    <p>ここが決まらないと、残り2行は自分の説明になります</p></div>
  </div>
  <div class="step">
    <div class="no">何を</div>
    <div class="tx"><h2>「何のお店か3秒で分かるか」という問題を、</h2>
    <p>やったことではなく、相手が困っていたこと</p></div>
  </div>
  <div class="step">
    <div class="no">どう</div>
    <div class="tx"><h2>写真を減らして言葉を1つに絞ることで整理しました。</h2>
    <p>なぜそうしたかまで書くと、判断が伝わります</p></div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>資格も件数も、<span style="color:#1B2A4A">出てきません</span></span>
</div>
</body></html>
