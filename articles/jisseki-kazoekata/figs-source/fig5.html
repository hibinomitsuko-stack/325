<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px;overflow:hidden}
.sheet{margin:48px 110px 0;background:#fff;border:3px solid #f4b271;border-radius:26px;
  padding:34px 44px 40px;box-shadow:0 14px 30px rgba(190,130,50,.12)}
.row{display:flex;align-items:flex-start;gap:24px;padding:22px 0}
.row+.row{border-top:1.5px dashed #e4d7c4}
.lb{flex:none;width:112px;height:56px;border-radius:14px;background:#f5822b;color:#fff;
  font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
.bd{flex:1}
.ln{height:50px;border-bottom:3px dotted #d9c3a6;margin-bottom:10px}
.hint{font-size:21px;font-weight:800;color:#9aa3b2;line-height:1.5}
.tail{font-size:26px;font-weight:900;color:#1B2A4A;margin-left:136px}
</style></head><body>
<div class="head"><h1>実績3行<span class="o ul">ワークシート</span></h1></div>
<div class="sheet">
  <div class="row"><div class="lb">誰の</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">業種・状況で1人に絞る　例）予約が埋まらない小さなサロンの方の、</div></div></div>
  <div class="row"><div class="lb">何を</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">やったことではなく、相手が困っていたこと　例）何のお店か3秒で分からない、という問題を、</div></div></div>
  <div class="row"><div class="lb">どう</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">なぜそうしたかまで　例）写真を減らして言葉を1つに絞ることで整理しました。</div></div></div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>今日は、<span style="color:#1B2A4A">1つ書けたら終わり</span></span>
</div>
</body></html>
