<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px;overflow:hidden}
.wrap{padding:48px 90px 0;display:flex;flex-direction:column;gap:26px}
.card{background:#fff;border-radius:22px;padding:26px 34px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.b{border:2.5px solid #cfd5df}
.a{border:2.5px solid #f4b271}
.tag{display:inline-block;font-size:22px;font-weight:900;color:#fff;padding:7px 24px;border-radius:999px;margin-bottom:14px}
.b .tag{background:#9aa3b2}
.a .tag{background:#f5822b}
.msg{font-size:30px;font-weight:900;line-height:1.6;color:#1B2A4A}
.note{margin-top:14px;font-size:23px;font-weight:800}
.b .note{color:#7b8292}
.a .note{color:#f5822b}
</style></head><body>
<div class="head"><h1>変えるのは作品ではなく、<span class="o ul">説明</span></h1></div>
<div class="wrap">
  <div class="card b">
    <span class="tag">BEFORE</span>
    <div class="msg">架空のカフェのチラシを作りました</div>
    <div class="note">→ 作ったものの名前しか分からない</div>
  </div>
  <div class="card a">
    <span class="tag">AFTER</span>
    <div class="msg">新規のお客様が入りにくい小さな店のために、<br>外から「何の店か」が分かるチラシを作りました</div>
    <div class="note">→ 誰の、何を解いたかが分かる</div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>作ったものは、<span style="color:#1B2A4A">同じです</span></span>
</div>
</body></html>
