<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:800px;overflow:hidden}
.row{display:flex;justify-content:center;gap:40px;padding:54px 80px 0}
.col{width:660px}
.cap{display:flex;align-items:center;justify-content:center;gap:14px;font-size:32px;font-weight:900;
  color:#fff;padding:16px 0;border-radius:20px 20px 0 0}
.l .cap{background:#9aa3b2}
.r .cap{background:#f5822b}
.box{background:#fff;border-radius:0 0 20px 20px;padding:26px 34px 30px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.l .box{border:2.5px solid #cfd5df;border-top:none}
.r .box{border:2.5px solid #f4b271;border-top:none}
li{list-style:none;font-size:27px;font-weight:800;line-height:1.5;padding:16px 0 16px 46px;position:relative;color:#1B2A4A}
li+li{border-top:1.5px dashed #e4d7c4}
li::before{content:"";position:absolute;left:8px;top:22px;width:22px;height:22px;border-radius:50%}
.l li::before{background:#9aa3b2}
.r li::before{background:#f5822b}
.sub{margin-top:18px;font-size:24px;font-weight:900;text-align:center}
.l .sub{color:#7b8292}
.r .sub{color:#f5822b}
</style></head><body>
<div class="head"><h1>「実績」を、<span class="o ul">何で数えるか</span></h1></div>
<div class="row">
  <div class="col l">
    <div class="cap">自分が数えているもの</div>
    <div class="box"><ul>
      <li>納品した仕事の数</li>
      <li>クライアントの数</li>
      <li>資格、通ったスクール</li>
    </ul>
    <div class="sub">始めたばかりなら、0になる</div></div>
  </div>
  <div class="col r">
    <div class="cap">相手が見ているもの</div>
    <div class="box"><ul>
      <li>誰の、何を解いたか</li>
      <li>なぜ、そう判断したか</li>
      <li>自分にも同じことをしてくれそうか</li>
    </ul>
    <div class="sub">今日の手持ちでも書ける</div></div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>0なのは実力ではなく、<span style="color:#1B2A4A">物差しのほう</span></span>
</div>
</body></html>
