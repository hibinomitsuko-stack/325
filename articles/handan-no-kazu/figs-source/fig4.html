<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px;overflow:hidden}
.sheet{margin:48px 110px 0;background:#fff;border:3px solid #f4b271;border-radius:26px;
  padding:34px 44px 38px;box-shadow:0 14px 30px rgba(190,130,50,.12)}
.row{display:flex;align-items:flex-start;gap:24px;padding:24px 0}
.row+.row{border-top:1.5px dashed #e4d7c4}
.lb{flex:none;width:168px;height:56px;border-radius:14px;background:#f5822b;color:#fff;
  font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center}
.bd{flex:1}
.ln{height:50px;border-bottom:3px dotted #d9c3a6;margin-bottom:10px}
.hint{font-size:21px;font-weight:800;color:#9aa3b2;line-height:1.5}
</style></head><body>
<div class="head"><h1>1案<span class="o ul">1行</span>シート</h1></div>
<div class="sheet">
  <div class="row"><div class="lb">迷ったところ</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">思い出せないときは「いちばん時間がかかったところ」　例）配色を3案で迷った</div></div></div>
  <div class="row"><div class="lb">優先したこと</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">きれいな言葉でなくていい　例）読みやすさを優先した</div></div></div>
  <div class="row"><div class="lb">AIに聞いたあと</div><div class="bd">
    <div class="ln"></div>
    <div class="hint">変えた／変えなかった、とその理由　例）指摘はもらったが、今回の相手には関係ないので変えなかった</div></div></div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>「変えなかった」も、<span style="color:#1B2A4A">判断です</span></span>
</div>
</body></html>
