<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:860px;overflow:hidden}
.row{display:flex;justify-content:center;gap:40px;padding:50px 80px 0}
.col{width:660px}
.cap{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;
  color:#fff;padding:15px 0;border-radius:20px 20px 0 0}
.l .cap{background:#9aa3b2}
.r .cap{background:#f5822b}
.box{background:#fff;border-radius:0 0 20px 20px;padding:24px 30px 26px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.l .box{border:2.5px solid #cfd5df;border-top:none}
.r .box{border:2.5px solid #f4b271;border-top:none}
.st{font-size:26px;font-weight:900;color:#1B2A4A;padding:13px 0}
.ar{font-size:22px;font-weight:900;padding-left:6px}
.l .ar{color:#cfd5df}
.r .ar{color:#f4b271}
.res{margin-top:12px;border-top:2px dashed #e4d7c4;padding-top:16px;font-size:25px;font-weight:900;line-height:1.5}
.l .res{color:#7b8292}
.r .res{color:#f5822b}
</style></head><body>
<div class="head"><h1>AIを使う<span class="o ul">順番</span>で、残るものが変わる</h1></div>
<div class="row">
  <div class="col l">
    <div class="cap">育たない順番</div>
    <div class="box">
      <div class="st">AIに聞く</div><div class="ar">▼</div>
      <div class="st">出てきたものを見る</div><div class="ar">▼</div>
      <div class="st">なんとなく選ぶ</div>
      <div class="res">自分の答えが、<br>上書きされて残らない</div>
    </div>
  </div>
  <div class="col r">
    <div class="cap">育つ順番</div>
    <div class="box">
      <div class="st">自分で決める</div><div class="ar">▼</div>
      <div class="st">1行、書く</div><div class="ar">▼</div>
      <div class="st">そのあとAIに見せる</div>
      <div class="res">変えても変えなくても、<br>理由が残る</div>
    </div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>先に見ると、<span style="color:#1B2A4A">思い出したと錯覚する</span></span>
</div>
</body></html>
