<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:900px;overflow:hidden}
.wrap{padding:44px 120px 0}
.axtop{font-size:25px;font-weight:900;color:#f5822b;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.c{background:#fff;border:2.5px solid #e4d7c4;border-radius:20px;padding:24px 28px;height:216px;
  box-shadow:0 10px 22px rgba(190,130,50,.08)}
.c h2{font-size:29px;font-weight:900;color:#1B2A4A;line-height:1.35}
.c p{font-size:22px;font-weight:800;color:#7b8292;margin-top:12px;line-height:1.55}
.hi{border-color:#f5822b;background:#fff8f0}
.hi h2{color:#f5822b}
.hi p{color:#41495c}
.axbtm{text-align:right;font-size:25px;font-weight:900;color:#f5822b;margin-top:14px}
</style></head><body>
<div class="head"><h1>増えるのは、<span class="o ul">言葉にした回数</span></h1></div>
<div class="wrap">
  <div class="axtop">▲ 上にいくほど、言葉にした回数が多い</div>
  <div class="g">
    <div class="c hi"><h2>経験は浅い／書いている</h2><p>年数は足りなくても、聞かれたら答えられる。<br>今日から入れる場所</p></div>
    <div class="c hi"><h2>経験が長い／書いている</h2><p>いちばん強い。<br>ただし、ここに自然には来ない</p></div>
    <div class="c"><h2>経験は浅い／書いていない</h2><p>ほとんどの人のスタート地点。<br>迷っても残らない</p></div>
    <div class="c"><h2>経験が長い／書いていない</h2><p>上手いのに「なんとなく」で止まる</p></div>
  </div>
  <div class="axbtm">右にいくほど、経験年数が長い ▶</div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>動かせるのは、<span style="color:#1B2A4A">縦の軸だけ</span></span>
</div>
</body></html>
