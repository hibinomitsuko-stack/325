<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:800px;overflow:hidden}
.row{display:flex;justify-content:center;gap:40px;padding:54px 80px 0}
.col{width:660px}
.cap{display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900;
  color:#fff;padding:16px 0;border-radius:20px 20px 0 0}
.l .cap{background:#9aa3b2}
.r .cap{background:#f5822b}
.box{background:#fff;border-radius:0 0 20px 20px;padding:26px 32px 30px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.l .box{border:2.5px solid #cfd5df;border-top:none}
.r .box{border:2.5px solid #f4b271;border-top:none}
li{list-style:none;font-size:26px;font-weight:800;line-height:1.5;padding:17px 0 17px 44px;position:relative;color:#1B2A4A}
li+li{border-top:1.5px dashed #e4d7c4}
li::before{content:"";position:absolute;left:8px;top:23px;width:20px;height:20px;border-radius:50%}
.l li::before{background:#9aa3b2}
.r li::before{background:#f5822b}
.sub{margin-top:18px;font-size:24px;font-weight:900;text-align:center}
.l .sub{color:#7b8292}
.r .sub{color:#f5822b}
</style></head><body>
<div class="head"><h1>AI時代の記事が、<span class="o ul">止まる場所</span></h1></div>
<div class="row">
  <div class="col l">
    <div class="cap">よく書かれていること</div>
    <div class="box"><ul>
      <li>判断できる人が残る</li>
      <li>経験が多い人ほど強い</li>
      <li>見慣れないうちは難しい</li>
    </ul>
    <div class="sub">＝ 待つしかない</div></div>
  </div>
  <div class="col r">
    <div class="cap">書かれていないこと</div>
    <div class="box"><ul>
      <li>経験が浅い人は、今日何をするか</li>
      <li>年数以外に、何で増えるのか</li>
      <li>AIをどの順番で使うのか</li>
    </ul>
    <div class="sub">＝ 今日からできる</div></div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>足りないのは、<span style="color:#1B2A4A">経験年数ではない</span></span>
</div>
</body></html>
