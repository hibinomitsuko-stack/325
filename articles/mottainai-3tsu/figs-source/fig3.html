<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:830px}
.wrap{padding:42px 90px 0;position:relative;z-index:2;display:flex;gap:34px}
.col{flex:1;padding:26px 34px}
.cap{font-size:25px;font-weight:900;margin-bottom:18px}
.m .cap{color:var(--neon)}.c .cap{color:var(--cyan)}
.it{font-size:26px;font-weight:900;padding:16px 0;line-height:1.4;
  border-bottom:1.5px dashed rgba(185,196,255,.22);display:flex;gap:16px}
.it:last-child{border-bottom:0}
.n{color:var(--mag);flex:none}
.c .it{font-size:25px}
.note{position:absolute;left:90px;right:90px;bottom:168px;text-align:center;
  font-size:27px;font-weight:900;color:#fff;z-index:2}
.note b{color:var(--neon);text-shadow:0 0 12px rgba(217,255,61,.5)}
</style></head><body>
<div class="head"><h1>見つけるのは、<span class="o ul">3つ</span>だけ</h1></div>
<div class="wrap">
  <div class="col neon m">
    <div class="cap">自分に聞く3つ</div>
    <div class="it"><span class="n">1</span><span>自分が客なら、買いたくなるか</span></div>
    <div class="it"><span class="n">2</span><span>友達にすすめたいと思うか</span></div>
    <div class="it"><span class="n">3</span><span>スマホで見て、分かりやすいか</span></div>
  </div>
  <div class="col neon c">
    <div class="cap">実際に書いた3つ（手作り石鹸）</div>
    <div class="it"><span class="n">1</span><span>画像が暗くて、質感が分からない</span></div>
    <div class="it"><span class="n">2</span><span>説明文が長く、途中で読むのをやめた</span></div>
    <div class="it"><span class="n">3</span><span>他の石鹸との違いが書かれていない</span></div>
  </div>
</div>
<div class="note">1つだと<b>たまたま</b>に見える。5つ以上は<b>ダメ出しの一覧</b>になる</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>分析もリサーチも、<span class="hl">していない</span></span></div>
</body></html>
