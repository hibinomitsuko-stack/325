<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:960px}
.wrap{padding:44px 96px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.card{display:flex;align-items:center;gap:26px;padding:22px 36px}
.no{width:60px;height:60px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#05040f;background:var(--neon);box-shadow:0 0 16px rgba(217,255,61,.65)}
.t{font-size:30px;font-weight:900;line-height:1.35}
.ng{padding:22px 36px;margin-top:4px}
.ng .h{font-size:24px;font-weight:900;color:#8690b8;margin-bottom:10px}
.ng .b{font-size:28px;font-weight:900;color:#9aa4ca;line-height:1.45}
.x{flex:none;width:50px;height:50px;border-radius:50%;background:rgba(120,132,180,.25);
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#aab3d8}
.ngrow{display:flex;align-items:center;gap:26px}
</style></head><body>
<div class="head"><h1>「もったいない」店の、<span class="o ul">探し方</span></h1></div>
<div class="wrap">
  <div class="card neon m"><div class="no">1</div><div class="t">商品は良さそうなのに、ページが見づらい</div></div>
  <div class="card neon m"><div class="no">2</div><div class="t">レビューは良いのに、写真が暗い</div></div>
  <div class="card neon m"><div class="no">3</div><div class="t">投稿の内容は良いのに、何の人か分からない</div></div>
  <div class="neon dim ng"><div class="ngrow">
    <div class="x">×</div>
    <div><div class="h">これは外す</div>
    <div class="b">「自分ならもっと上手く作れる」と思った店<br>
      <span style="font-size:23px;color:#7f89b4">— それは自分の話に戻っています</span></div></div>
  </div></div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>探すのは、<span class="hl">客として手が止まった店</span></span></div>
</body></html>
