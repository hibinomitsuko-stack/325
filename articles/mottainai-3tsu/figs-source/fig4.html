<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:880px}
.wrap{padding:42px 96px 0;position:relative;z-index:2}
.sheet{padding:28px 44px 30px}
.ttl{font-size:24px;font-weight:900;color:var(--neon);margin-bottom:16px}
.store{display:flex;align-items:center;gap:20px;padding-bottom:18px;margin-bottom:8px;
  border-bottom:1.5px dashed rgba(185,196,255,.3)}
.store .k{font-size:25px;font-weight:900;flex:none}
.store .ln{flex:1;border-bottom:2.5px dotted rgba(185,196,255,.5);height:30px}
.row{display:flex;align-items:center;gap:22px;padding:15px 0;border-bottom:1.5px dashed rgba(185,196,255,.2)}
.row:last-of-type{border-bottom:0}
.n{font-size:25px;font-weight:900;color:var(--mag);flex:none;width:44px}
.ln2{flex:1;border-bottom:2.5px dotted rgba(185,196,255,.5);height:30px}
.chk{margin-top:20px;padding-top:18px;border-top:1.5px dashed rgba(185,196,255,.3)}
.ck2{display:flex;align-items:center;gap:15px;font-size:24px;font-weight:800;color:#e8ecff;padding:8px 0}
.box{width:24px;height:24px;border:2.5px solid var(--cyan);border-radius:6px;flex:none}
</style></head><body>
<div class="head"><h1>1通ぶんの、<span class="o ul">もったいない</span></h1></div>
<div class="wrap">
  <div class="sheet neon m">
    <div class="ttl">客として手が止まった店を、1つだけ（5分）</div>
    <div class="store"><div class="k">お店</div><div class="ln"></div></div>
    <div class="row"><div class="n">1</div><div class="ln2"></div></div>
    <div class="row"><div class="n">2</div><div class="ln2"></div></div>
    <div class="row"><div class="n">3</div><div class="ln2"></div></div>
    <div class="chk">
      <div class="ck2"><span class="box"></span>困るのが「相手のお客さん」になっているか</div>
      <div class="ck2"><span class="box"></span>数字を約束していないか</div>
      <div class="ck2"><span class="box"></span>直し方は、方向だけで止めているか</div>
    </div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>今日は<span class="hl">書けたら終わり</span>。送らなくていい</span></div>
</body></html>
