<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:900px}
.wrap{padding:44px 90px 0;position:relative;z-index:2;display:flex;flex-direction:column;gap:22px}
.row{padding:24px 38px}
.lb{font-size:25px;font-weight:900;margin-bottom:16px}
.m .lb{color:var(--neon)}.dim .lb{color:#8690b8}
.flow{display:flex;align-items:center;gap:18px;flex-wrap:nowrap}
.st{flex:1;text-align:center;font-size:26px;font-weight:900;padding:16px 10px;border-radius:12px;line-height:1.35}
.m .st{background:rgba(240,38,200,.16);color:#fff}
.dim .st{background:rgba(120,132,180,.18);color:#9aa4ca}
.ar{font-size:26px;font-weight:900;flex:none}
.m .ar{color:var(--mag)}.dim .ar{color:#5f6a94}
.res{margin-top:16px;padding-top:14px;border-top:1.5px dashed rgba(185,196,255,.3);font-size:26px;font-weight:900;text-align:center}
.m .res{color:var(--neon);text-shadow:0 0 14px rgba(217,255,61,.55)}
.dim .res{color:#8690b8}
</style></head><body>
<div class="head"><h1>変えたのは、<span class="o ul">順番</span>だけでした</h1></div>
<div class="wrap">
  <div class="neon dim row">
    <div class="lb">これまで（122件応募して、0件）</div>
    <div class="flow">
      <div class="st">募集を待つ</div><div class="ar">▶</div>
      <div class="st">自分を説明する</div><div class="ar">▶</div>
      <div class="st">作品を見せる</div>
    </div>
    <div class="res">待っている間、直せるのは自分の作品だけ</div>
  </div>
  <div class="neon m row">
    <div class="lb">変えた後（42件送って、23件）</div>
    <div class="flow">
      <div class="st">相手を見る</div><div class="ar">▶</div>
      <div class="st">もったいないを3つ書く</div><div class="ar">▶</div>
      <div class="st">作品は送らない</div>
    </div>
    <div class="res">募集が出ていなくても、今日動ける</div>
  </div>
</div>
<div class="foot"><span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#d9ff3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span>デザインの腕は、<span class="hl">1ミリも変えていない</span></span></div>
</body></html>
