<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:760px;overflow:hidden}
.wrap{padding:56px 110px 0;display:flex;flex-direction:column;gap:26px}
.step{display:flex;align-items:center;gap:30px;background:#fff;border:2.5px solid #f4b271;border-radius:24px;
  padding:28px 36px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.no{flex:none;width:86px;height:86px;border-radius:50%;background:#f5822b;color:#fff;
  font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tx h2{font-size:34px;font-weight:900;color:#1B2A4A;line-height:1.4}
.tx p{font-size:25px;font-weight:800;color:#7b8292;margin-top:10px;line-height:1.5}
</style></head><body>
<div class="head"><h1>次の初稿で、<span class="o ul">やること</span>はこれだけ</h1></div>
<div class="wrap">
  <div class="step">
    <div class="no">1</div>
    <div class="tx">
      <h2>冒頭に2行足す</h2>
      <p>「この制作で達成したいのは◯◯です。<br>そのために、この順番で見せる構成にしました」</p>
    </div>
  </div>
  <div class="step">
    <div class="no">2</div>
    <div class="tx">
      <h2>迷っているところを、1つだけ開けておく</h2>
      <p>「配色だけ2案あります」「見出しの言い回しだけ迷っています」</p>
    </div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>作り方は、<span style="color:#1B2A4A">変えなくていい</span></span>
</div>
</body></html>
