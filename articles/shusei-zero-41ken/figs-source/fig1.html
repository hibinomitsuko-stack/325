<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:720px;overflow:hidden}
.row{display:flex;justify-content:center;align-items:center;gap:30px;padding:58px 70px 0}
.card{background:#fff;border:2.5px solid #f4b271;border-radius:24px;padding:32px 20px 26px;
  box-shadow:0 12px 26px rgba(190,130,50,.10);width:382px;text-align:center}
.ic{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:#fdecda;color:#f5822b;
  display:flex;align-items:center;justify-content:center}
.ic svg{width:44px;height:44px}
.num{font-size:60px;font-weight:900;line-height:1.1}
.num .u{font-size:27px}
.name{font-size:20px;font-weight:800;margin-top:12px;color:#41495c;line-height:1.5}
.hl{border-color:#1B2A4A}
.hl .ic{background:#e7ebf3;color:#1B2A4A}
.hl .num{color:#f5822b}
.ar{font-size:46px;color:#f4b271;font-weight:900}
</style></head><body>
<div class="head"><h1>「修正ゼロ」の<span class="o ul">その後</span>を数えました</h1></div>
<div class="row">
  <div class="card">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><rect x="8" y="7" width="32" height="34" rx="4" stroke="currentColor" stroke-width="3"/><path d="M15 18h18M15 26h18M15 34h11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="num">41<span class="u">件</span></div>
    <div class="name">修正が一度もなかった案件<br>（6年分）</div>
  </div>
  <div class="ar">▶</div>
  <div class="card hl">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><path d="M24 41S7 30 7 19a9 9 0 0117-4 9 9 0 0117 4c0 11-17 22-17 22z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <div class="num">3<span class="u">件</span></div>
    <div class="name">2回目の依頼が来た案件</div>
  </div>
  <div class="ar">▶</div>
  <div class="card">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><path d="M8 34l10-11 8 7 12-15" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 15h8v8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="num">2割<span class="u" style="font-size:40px;padding:0 10px;color:#f4b271">→</span>7割</div>
    <div class="name">出し方を変えた年の<br>継続率</div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>修正がないのは、<span style="color:#1B2A4A">満足とは限らない</span></span>
</div>
</body></html>
