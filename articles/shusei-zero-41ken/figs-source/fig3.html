<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:800px;overflow:hidden}
.row{display:flex;justify-content:center;gap:40px;padding:54px 80px 0}
.col{width:660px}
.cap{display:flex;align-items:center;justify-content:center;gap:14px;font-size:34px;font-weight:900;
  color:#fff;padding:16px 0;border-radius:20px 20px 0 0}
.l .cap{background:#1B2A4A}
.r .cap{background:#f5822b}
.box{background:#fff;border-radius:0 0 20px 20px;padding:28px 34px 30px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.l .box{border:2.5px solid #1B2A4A;border-top:none}
.r .box{border:2.5px solid #f4b271;border-top:none}
li{list-style:none;font-size:27px;font-weight:800;line-height:1.5;padding:15px 0 15px 46px;position:relative;color:#1B2A4A}
li+li{border-top:1.5px dashed #e4d7c4}
li::before{content:"";position:absolute;left:8px;top:21px;width:22px;height:22px;border-radius:50%}
.l li::before{background:#1B2A4A}
.r li::before{background:#f5822b}
.sub{margin-top:18px;font-size:23px;font-weight:800;text-align:center;color:#7b8292}
</style></head><body>
<div class="head"><h1>「7割で出す」の、<span class="o ul">7割はどこか</span></h1></div>
<div class="row">
  <div class="col l">
    <div class="cap">100% 固めて出す</div>
    <div class="box"><ul>
      <li>この制作で、何を達成したいのか</li>
      <li>なぜ、この構成にしたのか</li>
      <li>誰に、どの順番で見せるのか</li>
    </ul>
    <div class="sub">＝ 判断の根拠</div></div>
  </div>
  <div class="col r">
    <div class="cap">70% で出す</div>
    <div class="box"><ul>
      <li>配色</li>
      <li>文字の大きさ、書体</li>
      <li>装飾、あしらい</li>
    </ul>
    <div class="sub">＝ 表側の仕上がり</div></div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>根拠まで7割にすると、<span style="color:#1B2A4A">それは丸投げ</span></span>
</div>
</body></html>
