<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@import url("base.css");
html,body{width:1600px;height:760px;overflow:hidden}
.row{display:flex;justify-content:center;gap:40px;padding:54px 80px 0}
.col{width:660px}
.tag{display:inline-block;font-size:24px;font-weight:900;color:#fff;padding:9px 26px;border-radius:999px;margin-bottom:14px}
.b .tag{background:#9aa3b2}
.a .tag{background:#f5822b}
.box{background:#fff;border-radius:22px;padding:30px 30px;box-shadow:0 12px 26px rgba(190,130,50,.10);min-height:214px}
.b .box{border:2.5px solid #cfd5df}
.a .box{border:2.5px solid #f4b271}
.msg{font-size:26px;font-weight:800;line-height:1.75;color:#1B2A4A}
.note{margin-top:18px;font-size:22px;font-weight:800;line-height:1.6}
.b .note{color:#7b8292}
.a .note{color:#f5822b}
</style></head><body>
<div class="head"><h1>初稿に添える<span class="o ul">一文</span>を変えました</h1></div>
<div class="row">
  <div class="col b">
    <span class="tag">BEFORE</span>
    <div class="box">
      <div class="msg">「お待たせしました。<br>ご要望をすべて反映しております。<br>ご確認ください」</div>
      <div class="note">→ 直してほしくても、<br>　 言い出せなくなる</div>
    </div>
  </div>
  <div class="col a">
    <span class="tag">AFTER</span>
    <div class="box">
      <div class="msg">「7割の状態です。<br>◯◯を達成するために、<br>この構成にしました。<br>配色は2案で迷っています」</div>
      <div class="note">→ 相手の言葉が出てくる</div>
    </div>
  </div>
</div>
<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span>完成品に見せると、<span style="color:#1B2A4A">相手の口が閉じる</span></span>
</div>
</body></html>
