<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fbf3e4;font-family:'Zen Maru Gothic',sans-serif;color:#2b2b2b}
.board{position:absolute;left:60px;top:220px;width:960px;height:860px;background:#2f5d4a;border:26px solid #b07a43;border-radius:20px;box-shadow:0 14px 0 #8a5c2e}
.top{position:absolute;top:70px;width:100%;text-align:center;font-size:58px;font-weight:900;color:#e2574c;animation:pop .5s .1s both}
.top span{background:#fff;padding:12px 36px;border-radius:60px;box-shadow:0 6px 0 #e2574c}
.chalk{position:absolute;width:100%;text-align:center;color:#fff}
.label{top:70px;font-size:50px;color:#ffe08a;font-weight:700;animation:fade .4s 2s both}
.word{top:200px;font-size:140px;font-weight:900;white-space:nowrap}
.word i{font-style:normal;display:inline-block;animation:ink .25s both}
.roma{top:440px;font-size:64px;color:#bfe3d0;animation:fade .4s 3.9s both}
.mean{top:560px;font-size:58px;animation:fade .4s 4.5s both}
.mean b{color:#ffe08a}
.ex{top:120px;font-size:60px;line-height:1.6;animation:fade .4s 6.1s both}
.ex .big{white-space:nowrap;font-size:96px;font-weight:900;color:#ffe08a}
.s1{animation:out .3s 5.8s forwards}
.s2{opacity:0;animation:in .3s 6s forwards}
.teacher{position:absolute;left:90px;top:1130px;width:520px;animation:slide .6s .2s both}
.mouth{transform-origin:260px 330px;animation:talk .18s infinite alternate}
.arm{transform-origin:400px 520px;animation:point 1s 2s ease-in-out infinite alternate}
.bubble{position:absolute;right:60px;top:1150px;width:500px;white-space:nowrap;background:#fff;border:6px solid #2b2b2b;border-radius:40px;padding:30px 20px;font-size:50px;font-weight:700;text-align:center;line-height:1.35}
.bubble:after{content:"";position:absolute;left:-46px;top:120px;border:24px solid transparent;border-right:40px solid #2b2b2b}
.b1{animation:pop .4s .6s both,out .2s 1.9s forwards}
.b2{opacity:0;animation:pop .4s 2.1s both,out .2s 5.8s forwards}
.b3{opacity:0;animation:pop .4s 6.2s both}
.b3 small{display:block;font-size:40px;color:#e2574c;margin-top:8px}
.cta{position:absolute;bottom:120px;width:100%;text-align:center;font-size:50px;font-weight:900;color:#fff;opacity:0;animation:pop .4s 8s both}
.cta span{background:#e2574c;padding:20px 50px;border-radius:60px}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes ink{from{opacity:0;transform:translateY(-30px) scale(1.4)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0}}
@keyframes in{to{opacity:1}}
@keyframes slide{from{transform:translateY(500px)}to{transform:none}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
@keyframes point{from{transform:rotate(0)}to{transform:rotate(-12deg)}}
</style></head><body>
<div class="top"><span>1日1フレーズ 日本語レッスン</span></div>
<div class="board">
 <div class="s1">
  <div class="chalk label">今日のことば</div>
  <div class="chalk word"><i style="animation-delay:2.3s">い</i><i style="animation-delay:2.55s">た</i><i style="animation-delay:2.8s">だ</i><i style="animation-delay:3.05s">き</i><i style="animation-delay:3.3s">ま</i><i style="animation-delay:3.55s">す</i></div>
  <div class="chalk roma">i - ta - da - ki - ma - su</div>
  <div class="chalk mean">= <b>Let's eat!</b><br>（食べる前のあいさつ）</div>
 </div>
 <div class="s2">
  <div class="chalk ex">🍙 ごはんの前に…<br>手を合わせて<br><span class="big">「いただきます！」</span></div>
 </div>
</div>
<svg class="teacher" viewBox="0 0 520 760">
 <rect x="110" y="430" width="300" height="330" rx="90" fill="#4a7bd1"/>
 <path d="M220 430 L260 500 L300 430Z" fill="#fff"/>
 <g class="arm"><rect x="370" y="460" width="60" height="200" rx="30" fill="#4a7bd1" transform="rotate(-150 400 490)"/><circle cx="470" cy="330" r="34" fill="#f6d2b4"/><rect x="480" y="160" width="12" height="170" rx="6" fill="#8a5c2e" transform="rotate(20 486 330)"/></g>
 <rect x="230" y="370" width="60" height="70" fill="#f6d2b4"/>
 <path d="M100 250 Q100 60 260 60 Q420 60 420 250 L430 420 L90 420Z" fill="#3b2a24"/>
 <circle cx="260" cy="260" r="150" fill="#f6d2b4"/>
 <path d="M110 230 Q130 90 260 90 Q390 90 410 230 Q330 150 200 170 Q150 180 110 230Z" fill="#3b2a24"/>
 <circle cx="205" cy="265" r="36" fill="none" stroke="#2b2b2b" stroke-width="7"/><circle cx="315" cy="265" r="36" fill="none" stroke="#2b2b2b" stroke-width="7"/><line x1="241" y1="265" x2="279" y2="265" stroke="#2b2b2b" stroke-width="7"/>
 <circle cx="205" cy="268" r="10" fill="#2b2b2b"/><circle cx="315" cy="268" r="10" fill="#2b2b2b"/>
 <circle cx="165" cy="315" r="20" fill="#f4a7a0" opacity=".7"/><circle cx="355" cy="315" r="20" fill="#f4a7a0" opacity=".7"/>
 <ellipse class="mouth" cx="260" cy="330" rx="30" ry="22" fill="#c94a4a"/>
</svg>
<div class="bubble b1">こんにちは！</div>
<div class="bubble b2">今日のことばは<br>これです！</div>
<div class="bubble b3">一緒に<br>言ってみよう！<small>Let's say it!</small></div>
<div class="cta"><span>フォローして毎日ひとこと ▶</span></div>
</body></html>
